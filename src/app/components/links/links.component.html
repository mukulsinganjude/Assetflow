<div class="p-6 md:p-8 max-w-6xl mx-auto w-full space-y-6 animate-fade-in">
  <section class="glass-card rounded-3xl overflow-hidden">
    <header class="p-6 border-b border-slate-200/50 dark:border-white/10 flex items-center justify-between gap-4">
      <div><h1 class="text-xl font-black text-slate-800 dark:text-white"><i class="fa-solid fa-link text-indigo-400 mr-2"></i>Shared Links</h1><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Useful company websites and resources for the team.</p></div>
      <div class="flex items-center gap-2 flex-wrap justify-end">
        <button type="button" (click)="downloadTemplate()" class="glass-card px-3 py-2.5 rounded-xl text-xs font-semibold"><i class="fa-solid fa-file-arrow-down mr-1"></i>Template</button>
        <label *ngIf="canImport()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2.5 rounded-xl text-xs font-semibold cursor-pointer"><i class="fa-solid fa-file-import mr-1"></i>Import<input type="file" accept=".xlsx,.xls,.csv" (change)="importExcel($event)" class="hidden"></label>
        <button type="button" *ngIf="canExport()" (click)="exportExcel()" [disabled]="filteredLinks().length === 0" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2.5 rounded-xl text-xs font-semibold disabled:opacity-40"><i class="fa-solid fa-file-export mr-1"></i>Export</button>
        <button *ngIf="canAdd()" type="button" (click)="openAdd()" class="w-11 h-11 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg transition flex items-center justify-center" title="Add link" aria-label="Add link"><i class="fa-solid fa-plus"></i></button>
      </div>
    </header>
    <div class="p-5 md:p-6">
      <p *ngIf="data.quickLinksError()" class="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-500">{{ data.quickLinksError() }}</p>
      <div class="mb-5 relative w-full sm:max-w-sm"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i><input [ngModel]="search()" (ngModelChange)="onSearch($event)" maxlength="120" placeholder="Search shared links..." aria-label="Search shared links" class="glass-input w-full rounded-xl pl-9 pr-3 py-2.5 text-sm dark:text-white"></div>
      <div *ngIf="filteredLinks().length; else emptyLinks" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        <article *ngFor="let link of filteredLinks()" class="glass-card rounded-2xl p-5 flex flex-col min-w-0">
          <div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="font-bold text-slate-900 dark:text-white truncate"><a [href]="linkHref(link.url)" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-500 hover:underline">{{ link.name }}</a></h2><p *ngIf="link.purpose" class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ link.purpose }}</p></div><button *ngIf="canDelete(link)" type="button" (click)="remove(link)" class="text-slate-400 hover:text-rose-500" title="Remove shared link" aria-label="Remove shared link"><i class="fa-solid fa-trash-can"></i></button></div>
          <a [href]="linkHref(link.url)" target="_blank" rel="noopener noreferrer" class="mt-4 inline-flex items-center gap-2 text-xs font-semibold text-indigo-500 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>Open link</span></a>
        </article>
      </div>
      <ng-template #emptyLinks><div *ngIf="!data.quickLinksError()" class="py-16 text-center text-slate-500 dark:text-slate-400"><i class="fa-solid fa-link text-3xl block mb-3 opacity-40"></i><p class="font-semibold">{{ search() ? 'No links match your search.' : 'No shared links yet.' }}</p><p *ngIf="!search()" class="text-xs mt-1">Use the plus button to add a company resource.</p></div></ng-template>
    </div>
  </section>
</div>

<!-- Compact add-link popup -->
<div *ngIf="addOpen()" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" (click)="closeAdd()">
  <section class="glass-card w-full max-w-sm rounded-2xl p-5 shadow-2xl animate-slide-up" role="dialog" aria-modal="true" aria-labelledby="add-link-title" (click)="$event.stopPropagation()">
    <header class="flex items-center justify-between mb-4"><h2 id="add-link-title" class="text-base font-black text-slate-900 dark:text-white"><i class="fa-solid fa-plus text-indigo-400 mr-2"></i>Add shared link</h2><button type="button" (click)="closeAdd()" class="text-slate-400 hover:text-rose-400" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></header>
    <form (submit)="save($event)" class="space-y-3">
      <label class="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Link name
        <input [(ngModel)]="name" name="name" required maxlength="100" placeholder="e.g. IT Help Desk" class="glass-input w-full mt-1 rounded-xl px-3 py-2.5 text-sm normal-case dark:text-white">
      </label>
      <label class="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Website URL
        <input [(ngModel)]="url" name="url" required type="url" maxlength="1000" placeholder="https://example.com" class="glass-input w-full mt-1 rounded-xl px-3 py-2.5 text-sm normal-case dark:text-white">
        <span class="block mt-1 text-[11px] font-medium normal-case tracking-normal text-slate-500 dark:text-slate-400">Shared links may open external websites. Verify the destination is trusted before opening.</span>
      </label>
      <label class="block text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">What is this link for? <span class="normal-case font-medium">(optional)</span>
        <textarea [(ngModel)]="purpose" name="purpose" maxlength="300" rows="2" placeholder="Short description for coworkers" class="glass-input w-full mt-1 rounded-xl px-3 py-2.5 text-sm normal-case dark:text-white resize-none"></textarea>
      </label>
      <p *ngIf="error()" class="text-xs text-rose-500 font-semibold">{{ error() }}</p>
      <footer class="flex justify-end gap-2 pt-2"><button type="button" (click)="closeAdd()" [disabled]="saving()" class="glass-card px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button><button type="submit" [disabled]="saving()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold disabled:opacity-50"><i class="fa-solid" [ngClass]="saving() ? 'fa-spinner fa-spin' : 'fa-plus'"></i> Add link</button></footer>
    </form>
  </section>
</div>
