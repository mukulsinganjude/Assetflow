<!-- Theme Settings slide-over -->
<div *ngIf="ui.themeSettingsOpen()" class="fixed inset-0 z-[70]" role="dialog" aria-modal="true" aria-label="Theme settings">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm animate-fade-in" (click)="close()"></div>

  <div class="af-theme-panel absolute right-0 top-0 h-full w-[440px] max-w-full flex flex-col overflow-hidden shadow-2xl">
    <!-- Header -->
    <div class="flex items-start justify-between gap-4 px-6 pt-6 pb-4 border-b border-slate-200/60 dark:border-white/10">
      <div>
        <h2 class="text-lg font-black text-slate-900 dark:text-white tracking-tight">Theme Settings</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Adjust the appearance to suit your preferences.</p>
      </div>
      <button type="button" (click)="close()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg leading-none p-1" aria-label="Close theme settings">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-7">

      <!-- Color preset -->
      <section>
        <h3 class="af-section-title">Color preset</h3>
        <div class="grid grid-cols-4 gap-3">
          <button *ngFor="let p of presets" type="button" class="af-opt p-2 flex flex-col items-center gap-1.5"
                  [class.af-selected]="theme.preset() === p.id" (click)="theme.setPreset(p.id)" [title]="p.label">
            <span *ngIf="theme.preset() === p.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="w-full h-11 rounded-lg" [style.background]="p.gradient"></span>
            <span class="text-[10px] font-semibold text-slate-600 dark:text-slate-300 text-center leading-tight truncate w-full">{{ p.label }}</span>
          </button>
        </div>
      </section>

      <!-- Font -->
      <section>
        <h3 class="af-section-title">Font</h3>
        <div class="grid grid-cols-3 gap-3">
          <button *ngFor="let f of fonts" type="button" class="af-opt py-4 flex flex-col items-center gap-1"
                  [class.af-selected]="theme.font() === f.id" (click)="theme.setFont(f.id)">
            <span *ngIf="theme.font() === f.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="text-xl font-bold text-slate-800 dark:text-white" [style.fontFamily]="f.family">Aa</span>
            <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ f.label }}</span>
          </button>
        </div>
      </section>

      <!-- Border radius -->
      <section>
        <h3 class="af-section-title">Border radius</h3>
        <div class="grid grid-cols-6 gap-2">
          <button *ngFor="let r of radii" type="button" class="af-opt pt-3 pb-1.5 flex flex-col items-center gap-1.5"
                  [class.af-selected]="theme.radius() === r.id" (click)="theme.setRadius(r.id)">
            <span *ngIf="theme.radius() === r.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="w-7 h-7 border-2 border-slate-400 dark:border-slate-500 border-b-0 border-r-0"
                  [style.borderTopLeftRadius]="r.px"></span>
            <span class="text-[10px] font-semibold text-slate-600 dark:text-slate-300">{{ r.label }}</span>
          </button>
        </div>
      </section>

      <!-- Density -->
      <section>
        <h3 class="af-section-title">Density</h3>
        <div class="grid grid-cols-3 gap-3">
          <button *ngFor="let d of densities" type="button" class="af-opt p-3 flex flex-col items-center gap-2"
                  [class.af-selected]="theme.density() === d.id" (click)="theme.setDensity(d.id)">
            <span *ngIf="theme.density() === d.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="w-full flex flex-col items-start gap-1 px-1">
              <span *ngFor="let w of d.lines" class="h-1 rounded-full bg-slate-400 dark:bg-slate-500" [style.width.%]="w"></span>
            </span>
            <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ d.label }}</span>
          </button>
        </div>
      </section>

      <!-- Shadow -->
      <section>
        <h3 class="af-section-title">Shadow</h3>
        <div class="grid grid-cols-4 gap-3">
          <button *ngFor="let s of shadows" type="button" class="af-opt p-2 flex flex-col items-center gap-2"
                  [class.af-selected]="theme.shadow() === s.id" (click)="theme.setShadow(s.id)" [title]="s.label">
            <span *ngIf="theme.shadow() === s.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="w-8 h-8 mt-1 rounded-lg bg-white dark:bg-slate-600" [style.boxShadow]="s.preview"></span>
            <span class="text-[10px] font-semibold text-slate-600 dark:text-slate-300">{{ s.label }}</span>
          </button>
        </div>
      </section>

      <!-- Glass gradient -->
      <section>
        <h3 class="af-section-title">Glass gradient</h3>
        <div class="grid grid-cols-4 gap-3">
          <button *ngFor="let g of glasses" type="button" class="af-opt p-2 flex flex-col items-center gap-1.5"
                  [class.af-selected]="theme.glass() === g.id" (click)="theme.setGlass(g.id)" [title]="g.label">
            <span *ngIf="theme.glass() === g.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <span class="w-full h-9 rounded-lg border border-white/40 dark:border-white/10" [style.background]="g.preview"></span>
            <span class="text-[10px] font-semibold text-slate-600 dark:text-slate-300">{{ g.label }}</span>
          </button>
        </div>
      </section>

      <!-- Cursor -->
      <section>
        <h3 class="af-section-title">Cursor</h3>
        <div class="grid grid-cols-2 gap-3">
          <button *ngFor="let c of cursors" type="button" class="af-opt p-3 flex flex-col items-center gap-2"
                  [class.af-selected]="theme.cursor() === c.id" (click)="theme.setCursor(c.id)" [title]="c.hint">
            <span *ngIf="theme.cursor() === c.id" class="af-check"><i class="fa-solid fa-check"></i></span>
            <i class="fa-solid {{ c.icon }} text-lg text-slate-700 dark:text-slate-200 mt-1"></i>
            <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ c.label }}</span>
            <span class="text-[10px] text-slate-400 text-center leading-tight">{{ c.hint }}</span>
          </button>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-200/60 dark:border-white/10">
      <span class="text-[11px] text-slate-400">Saved automatically on this device.</span>
      <button type="button" (click)="theme.reset()"
              class="px-4 py-2 rounded-full text-xs font-semibold text-rose-500 border border-rose-300/60 dark:border-rose-500/30 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition">
        Reset
      </button>
    </div>
  </div>
</div>
