services:
  - type: web
    name: assetflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASSETFLOW_STORAGE
        value: supabase
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ASSETFLOW_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: ASSETFLOW_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ASSETFLOW_BOOTSTRAP_ADMIN_NAME
        value: AssetFlow Administrator
